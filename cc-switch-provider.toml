# cc-switch → Codex → 添加供应商 → 配置
# 名称：Xiaomi MiMo (Desktop)
# Base URL：http://127.0.0.1:8788/v1
# Key：仓库中 bridge-secret.txt 的完整内容
#
# 注意：MiMo Desktop 26.922 起引擎列表里的 xiaomi/* 走云端、需要小米 API Key，
# 桌面订阅 token 调不通；可用的只有 mimo-desktop/*。用
# `node live-checks/native-responses-probe.mjs` 或直接看
# http://127.0.0.1:8788/v1/models 可以确认当前可用的模型 ID。
# model_catalog_json 指向独立的 mimo-models.json：cc-switch 每次切换供应商
# 都会重写 cc-switch-model-catalog.json，指向它会被冲掉。
model_provider = "mimo"
model = "mimo-desktop/mimo-pro"
model_catalog_json = "mimo-models.json"
web_search = "disabled"

[model_providers.mimo]
name = "mimo"
base_url = "http://127.0.0.1:8788/v1"
wire_api = "responses"
requires_openai_auth = false
experimental_bearer_token = "<填 bridge-secret.txt 的完整内容>"