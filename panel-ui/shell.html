<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>模型桥 · 控制面板</title>
<script>
(function () {
  var mode = "system";
  try { mode = localStorage.getItem("panel-theme") || "system"; } catch (e) {}
  var q = window.matchMedia("(prefers-color-scheme: dark)");
  function apply() {
    document.documentElement.dataset.theme = mode === "system" ? (q.matches ? "dark" : "light") : mode;
    document.documentElement.dataset.themeMode = mode;
  }
  window.__setTheme = function (next) {
    mode = next;
    try { next === "system" ? localStorage.removeItem("panel-theme") : localStorage.setItem("panel-theme", next); } catch (e) {}
    apply();
  };
  q.addEventListener("change", function () { if (mode === "system") apply(); });
  apply();
})();
</script>
<style>
{{CSS}}
</style>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4 16.5c2.6 0 4-2.2 4-4.6S9.8 6.6 12 6.6s4 3 4 5.3 1.4 4.6 4 4.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="6.4" r="1.5" fill="currentColor"/></symbol>
    <symbol id="i-dash" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h13l-3.2-3.2M20 16H7l3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="6.5" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="6" cy="17.5" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="12" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.3 6.5h4.2a3 3 0 0 1 3 3v.6M8.3 17.5h4.2a3 3 0 0 0 3-3v-.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 3.6l7 3.9v8.9l-7 3.9-7-3.9V7.5l7-3.9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M5.2 7.6L12 11.5l6.8-3.9M12 11.5v8.7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12.5h3.5l2-6 3.5 12 2.5-8 1.7 4h4.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7.5h10M18 7.5h2M4 16.5h4M12 16.5h8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="16" cy="7.5" r="2.1" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="16.5" r="2.1" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3.8v3.4M15 3.8v3.4M7.4 7.2h9.2v3.4a4.6 4.6 0 0 1-4.6 4.6A4.6 4.6 0 0 1 7.4 10.6V7.2zM12 15.2v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.4-5.5M19.5 4.5V9H15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15.5 8.5V6.4a1.9 1.9 0 0 0-1.9-1.9H6.4a1.9 1.9 0 0 0-1.9 1.9v7.2c0 1 .9 1.9 1.9 1.9h2.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15.5 15.5L20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.8V12l3 1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.2 3.5L5.8 13.4h5l-1 7.1 7.4-9.9h-5l1-7.1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.6l4.4 4.4L19 7.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="M9 7.5L4.5 12 9 16.5M15 7.5L19.5 12 15 16.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-coins" viewBox="0 0 24 24"><ellipse cx="12" cy="6.6" rx="7" ry="2.8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 6.6v4.8c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6.6M5 11.4v4.8c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8v-4.8" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  </svg>

  <div class="app">
    <aside class="side">
      <a class="brand" href="#/overview">
        <span class="mark"><svg class="i"><use href="#i-logo"/></svg></span>
        <span class="name">模型桥<span class="ver">{{VERSION}}</span></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="foot-row">
          <div class="seg" role="group" aria-label="外观">
          <button type="button" data-mode="system" title="跟随系统">跟随</button>
          <button type="button" data-mode="light" title="浅色">浅色</button>
          <button type="button" data-mode="dark" title="深色">深色</button>
          </div>
          <button class="btn quiet sm" data-act="help" type="button" title="键盘快捷键">?</button>
        </div>
        <div class="meta"><span class="dot ok"></span>仅监听 127.0.0.1<br />bridge :{{BRIDGE_PORT}} · 面板 :{{PANEL_PORT}}</div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="head-wrap">
        <div class="wrap">
          <div class="page-head" id="pageHead">
            <div class="titles"><h1>概览</h1><div class="sub">加载中…</div></div>
            <div class="tools" id="pageTools"></div>
          </div>
        </div>
      </div>
      <div class="wrap">
        <div id="pageBody">
          <div class="card"><div class="empty"><span class="ic"><svg class="i"><use href="#i-pulse"/></svg></span>正在读取 bridge 状态…</div></div>
        </div>
      </div>
    </main>
  </div>

  <div class="toasts" id="toasts"></div>

  <div id="plugin-source">
{{PLUGIN_CARDS}}
  </div>

  <script>
{{JS}}
  </script>
</body>
</html>
